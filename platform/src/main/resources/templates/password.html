<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        /* === 全局亮色主题 === */
        body { background-color: #f8f9fa; color: #212529; } /* 背景改浅灰，字改深灰 */

        /* 卡片样式：白底，浅灰边框 */
        .card { background-color: #ffffff; border: 1px solid #dee2e6; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #0d6efd; box-shadow: 0 .5rem 1rem rgba(0,0,0,.15); }

        /* 导航栏：白底 */
        .navbar { background-color: #ffffff !important; border-bottom: 1px solid #dee2e6; box-shadow: 0 2px 4px rgba(0,0,0,.05); }

        /* 标题左侧竖线颜色保持不变 */
        .section-title { border-left: 5px solid #ffc107; padding-left: 15px; margin-bottom: 20px; color: #212529; }

        /* 筛选框 */
        .filter-box { background-color: #ffffff; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #dee2e6; }

        /* 输入框适配 */
        .form-control { background-color: #fff; color: #212529; border: 1px solid #ced4da; }
        .form-control:focus { background-color: #fff; color: #212529; }

        /* 表格文字颜色 */
        .table { color: #212529; }
        .table thead { background-color: #e9ecef; }
    </style>
</head>
<body>

<div class="auth-box">
    <h3 class="text-center mb-4 text-white">🔒 修改密码</h3>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form action="/password/update" method="post">
        <div class="mb-3">
            <label class="form-label">当前旧密码</label>
            <input type="password" name="oldPassword" class="form-control" required placeholder="输入旧密码验证身份">
        </div>

        <div class="mb-3">
            <label class="form-label">新密码</label>
            <input type="password" name="newPassword" class="form-control" required placeholder="输入新密码">
        </div>

        <div class="mb-3">
            <label class="form-label">确认新密码</label>
            <input type="password" name="confirmPassword" class="form-control" required placeholder="再次输入新密码">
        </div>

        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-warning fw-bold">确认修改</button>
            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>
    </form>
</div>

</body>
</html>
