<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; display: flex; align-items: center; height: 100vh; justify-content: center; }
        .auth-box { background-color: #1e1e1e; padding: 40px; border-radius: 10px; width: 100%; max-width: 400px; border: 1px solid #333; }
        .form-control { background-color: #2d2d2d; border: 1px solid #444; color: #fff; }
        .form-control:focus { background-color: #2d2d2d; color: #fff; border-color: #ffc107; box-shadow: none; }
    </style>
</head>
<body>

<div class="auth-box">
    <h3 class="text-center mb-4 text-white">🔒 修改密码</h3>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form action="/password/update" method="post">
        <div class="mb-3">
            <label class="form-label">当前旧密码</label>
            <input type="password" name="oldPassword" class="form-control" required placeholder="输入旧密码验证身份">
        </div>

        <div class="mb-3">
            <label class="form-label">新密码</label>
            <input type="password" name="newPassword" class="form-control" required placeholder="输入新密码">
        </div>

        <div class="mb-3">
            <label class="form-label">确认新密码</label>
            <input type="password" name="confirmPassword" class="form-control" required placeholder="再次输入新密码">
        </div>

        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-warning fw-bold">确认修改</button>
            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>
    </form>
</div>

</body>
</html>
