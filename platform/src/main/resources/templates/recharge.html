<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账户充值 - 游光阁</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .recharge-box { width: 100%; max-width: 450px; padding: 40px; background: white; border-radius: 10px; border: 1px solid #dee2e6; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="recharge-box">
    <h3 class="text-center mb-4">💰 账户充值</h3>

    <p class="text-center text-muted">课程设计演示模式：点击即刻到账</p>

    <div class="alert alert-info text-center">
        当前余额：<strong class="text-success">￥<span th:text="${session.currentUser.balance}">0.00</span></strong>
    </div>

    <form action="/recharge" method="post">
        <div class="mb-4">
            <label class="form-label">充值金额</label>
            <div class="input-group">
                <span class="input-group-text">￥</span>
                <input type="number" name="amount" class="form-control" placeholder="请输入整数" min="1" max="10000" required>
            </div>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-warning fw-bold btn-lg">确认充值</button>
            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>
    </form>
</div>

</body>
</html>
