<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录 - 游光阁</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
        /* 补全 login-box 样式 */
        .login-box { width: 100%; max-width: 400px; padding: 40px; background-color: #ffffff; border-radius: 12px; border: 1px solid #dee2e6; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .form-control { background-color: #fff; color: #212529; border: 1px solid #ced4da; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25); }
        .brand-title { color: #212529; font-weight: bold; text-align: center; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 class="brand-title">💿 游光阁</h2>
    <h5 class="text-center mb-4 text-muted">欢迎回来，玩家</h5>

    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>登录失败！</strong> 账号或密码错误，请重试。
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${param.msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:if="${#strings.equals(param.msg, 'passwordChanged')}">密码修改成功，请重新登录！</span>
        <span th:if="${#strings.equals(param.msg, 'registered')}">注册成功，请直接登录！</span>
        <span th:if="${#strings.equals(param.msg, 'logout')}">您已安全退出登录。</span>

        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form action="/login" method="post">
        <div class="mb-3">
            <label class="form-label">账号 / 用户名</label>
            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="mb-4">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control"
                   placeholder="请输入密码" required
                   autocomplete="new-password"
                   readonly
                   onfocus="this.removeAttribute('readonly');">
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">立即登录</button>
    </form>

    <div class="mt-4 text-center">
        <span class="text-muted">还没有账号？</span>
        <a href="/register" class="text-info text-decoration-none">去注册</a>
    </div>
</div>


<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
