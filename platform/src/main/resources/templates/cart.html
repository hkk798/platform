<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>我的购物车 - 游光阁</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <style>
    /* === 全局亮色主题 === */
    body { background-color: #f8f9fa; color: #212529; } /* 背景改浅灰，字改深灰 */

    /* 卡片样式：白底，浅灰边框 */
    .card { background-color: #ffffff; border: 1px solid #dee2e6; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); border-color: #0d6efd; box-shadow: 0 .5rem 1rem rgba(0,0,0,.15); }

    /* 导航栏：白底 */
    .navbar { background-color: #ffffff !important; border-bottom: 1px solid #dee2e6; box-shadow: 0 2px 4px rgba(0,0,0,.05); }

    /* 标题左侧竖线颜色保持不变 */
    .section-title { border-left: 5px solid #ffc107; padding-left: 15px; margin-bottom: 20px; color: #212529; }

    /* 筛选框 */
    .filter-box { background-color: #ffffff; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #dee2e6; }

    /* 输入框适配 */
    .form-control { background-color: #fff; color: #212529; border: 1px solid #ced4da; }
    .form-control:focus { background-color: #fff; color: #212529; }

    /* 表格文字颜色 */
    .table { color: #212529; }
    .table thead { background-color: #e9ecef; }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white border-bottom shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-dark" href="/">💿 游光阁</a>
    <a href="/" class="btn btn-outline-dark btn-sm">继续购物</a>
  </div>
</nav>

<div class="container cart-container">
  <h3 class="mb-4 text-warning">🛒 购物车</h3>

  <div th:if="${cartItems != null and !cartItems.isEmpty()}">
    <table class="table table-hover align-middle">
      <thead>
      <tr>
        <th scope="col" width="15%">封面</th>
        <th scope="col" width="30%">游戏名称</th>
        <th scope="col" width="15%">单价</th>
        <th scope="col" width="10%" class="text-center">数量</th>
        <th scope="col" width="15%">小计</th>
        <th scope="col" width="15%">操作</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${cartItems}">
        <td>
          <img th:src="${item.platform}" class="cart-img" alt="封面" onerror="this.src='https://via.placeholder.com/120x68?text=No+Img'">
        </td>

        <td>
          <h6 class="mb-0" th:text="${item.productName}">游戏名</h6>
        </td>

        <td>￥<span th:text="${item.price}">0</span></td>

        <td class="text-center">1</td>

        <td class="text-warning fw-bold">￥<span th:text="${item.price}">0</span></td>

        <td>
          <a th:href="@{'/cart/remove?id='+${item.cartItemId}}" class="btn btn-sm btn-outline-danger">移除</a>
        </td>
      </tr>
      </tbody>
    </table>

    <div class="d-flex justify-content-end align-items-center mt-5 gap-4">
      <h4 class="mb-0">总计: <span class="text-warning display-6">￥<span th:text="${totalAmount}">0</span></span></h4>
      <a href="/order/confirm" class="btn btn-lg btn-danger px-5">去结算</a>
    </div>
  </div>

  <div th:if="${cartItems == null or cartItems.isEmpty()}" class="text-center py-5">
    <h4 class="text-muted">购物车是空的，去挑两张盘吧！</h4>
    <a href="/" class="btn btn-primary mt-3">去逛逛</a>
  </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
