<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>玩家注册 - 游光阁</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <style>
    /* === 全局亮色主题 === */
    body { background-color: #f8f9fa; color: #212529; } /* 背景改浅灰，字改深灰 */

    /* 卡片样式：白底，浅灰边框 */
    .card { background-color: #ffffff; border: 1px solid #dee2e6; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); border-color: #0d6efd; box-shadow: 0 .5rem 1rem rgba(0,0,0,.15); }

    /* 导航栏：白底 */
    .navbar { background-color: #ffffff !important; border-bottom: 1px solid #dee2e6; box-shadow: 0 2px 4px rgba(0,0,0,.05); }

    /* 标题左侧竖线颜色保持不变 */
    .section-title { border-left: 5px solid #ffc107; padding-left: 15px; margin-bottom: 20px; color: #212529; }

    /* 筛选框 */
    .filter-box { background-color: #ffffff; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #dee2e6; }

    /* 输入框适配 */
    .form-control { background-color: #fff; color: #212529; border: 1px solid #ced4da; }
    .form-control:focus { background-color: #fff; color: #212529; }

    /* 表格文字颜色 */
    .table { color: #212529; }
    .table thead { background-color: #e9ecef; }
  </style>
</head>
<body>

<div class="reg-box">
  <h3 class="text-center text-white mb-4">加入游光阁</h3>

  <form action="/register" method="post">
    <div class="mb-3">
      <label class="form-label">用户名</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">设置密码</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">电子邮箱</label>
      <input type="email" name="email" class="form-control" placeholder="可选">
    </div>
    <div class="mb-4">
      <label class="form-label">手机号</label>
      <input type="text" name="mobile" class="form-control" placeholder="可选">
    </div>

    <button type="submit" class="btn btn-warning w-100 fw-bold">注 册</button>
  </form>

  <div class="mt-3 text-center">
    <a href="/login" class="text-secondary text-decoration-none">已有账号？返回登录</a>
  </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
