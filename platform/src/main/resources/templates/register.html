<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>玩家注册 - 游光阁</title>
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
    /* 补全 reg-box 样式 */
    .reg-box { width: 100%; max-width: 450px; padding: 40px; background-color: #ffffff; border-radius: 12px; border: 1px solid #dee2e6; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    .form-control { background-color: #fff; color: #212529; border: 1px solid #ced4da; }
  </style>

  <h3 class="text-center text-dark mb-4">加入游光阁</h3>
</head>
<body>

<div class="reg-box">
  <h3 class="text-center text-white mb-4">加入游光阁</h3>

  <form action="/register" method="post">
    <div class="mb-3">
      <label class="form-label">用户名</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">设置密码</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">电子邮箱</label>
      <input type="email" name="email" class="form-control" placeholder="可选">
    </div>
    <div class="mb-4">
      <label class="form-label">手机号</label>
      <input type="text" name="mobile" class="form-control" placeholder="可选">
    </div>

    <button type="submit" class="btn btn-warning w-100 fw-bold">注 册</button>
  </form>

  <div class="mt-3 text-center">
    <a href="/login" class="text-secondary text-decoration-none">已有账号？返回登录</a>
  </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
