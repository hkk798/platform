<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支付成功 - 游光阁</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* 页面居中布局 */
        body {
            background-color: #f8f9fa;
            color: #212529;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 成功提示卡片样式 */
        .success-box {
            width: 100%;
            max-width: 480px;
            padding: 50px 40px;
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #dee2e6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }
        /* 图标样式 */
        .success-icon {
            font-size: 5rem;
            color: #198754; /* Bootstrap success green */
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="success-box">
    <i class="bi bi-check-circle-fill success-icon"></i>

    <h2 class="mb-3 text-dark fw-bold">支付成功！</h2>
    <p class="text-muted mb-5">您的订单已处理完成，游戏已自动存入您的库中。</p>

    <div class="d-grid gap-3">
        <a href="/my-games" class="btn btn-success btn-lg fw-bold">
            <i class="bi bi-controller"></i> 前往我的游戏库
        </a>

        <a href="/" class="btn btn-outline-secondary">
            <i class="bi bi-house"></i> 返回商城首页
        </a>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
